<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Inventario FEI</title>
  <link rel="stylesheet" href="../CSS/home.css" />
</head>

<body>
  <!-- Encabezado -->
  <header class="header">
    <div class="logo-uv">
      <img src="../images/logoUV.jpg" alt="Logo Universidad Veracruzana" loading="lazy" />
      <div class="text-uv">UNIVERSIDAD<br /><span>VERACRUZANA</span></div>
    </div>

    <div class="search-bar">
      <input type="text" placeholder="¿Qué estás buscando?" loading="lazy" />
    </div>

    <div class="logo-sistema">
      <img alt="Logo Sistema" src="../images/logoSistema.png" />
      <div class="text-sistema">SISTEMA DE<br /><span>INVENTARIO</span></div>
    </div>
  </header>

  <!-- Barra de Acciones -->
  <div class="actions-bar">
    <button class="btn btn-blue">
      REALIZAR TRANSFERENCIA <span class="icon"></span>
    </button>
    <button class="btn btn-blue">
      FILTRO DE BÚSQUEDA <span class="icon"></span>
    </button>
    <button class="btn btn-blue">
      REGISTRAR EQUIPO <span class="icon"></span>
    </button>
  </div>

  <main class="inventario-container">
    <div id="tablita-equipos" class="equipos-grid">
    </div>
  </main>

  <div class="paginacion">
    <button id="btn-anterior" class="btn-paginacion" disabled>
      ← Anterior
    </button>

    <span id="numero-pagina">
      Página 1
    </span>

    <button id="btn-siguiente" class="btn-paginacion">
      Siguiente →
    </button>
  </div>

  <script src="../JS/home.js"></script>

</body>
</html>
